<form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
  <div>
    <label>Email:</label>
    <input type="email" formControlName="email" required>
  </div>
  <div>
    <label>Contrasenya:</label>
    <input type="password" formControlName="contrasenya" required>
  </div>
  <button type="submit" [disabled]="!loginForm.valid">Iniciar sessió</button>
  <div *ngIf="mensageError" class="error">
    {{ mensageError }}
  </div>
</form>
