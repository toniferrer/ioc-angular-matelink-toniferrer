<form class="formulario-buscar" (ngSubmit)="buscar()">
    <div class="contenedor-buscador">
        <label for="texto">Buscar</label>
        <input type="text" id="texto" name="texto" placeholder="Buscar..." class="texto" [(ngModel)]="texto">
        <button type="submit" class="boton-buscar">
        Buscar
        </button>
        <button *ngIf="texto" type="button" (click)="borrar()" class="boton-borrar">
        Borrar
        </button>
    </div>
</form>
